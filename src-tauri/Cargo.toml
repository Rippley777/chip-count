[package]
name = "chip-count"
version = "0.1.1"
description = "Know where every token went."
authors = ["Rippley Labs"]
edition = "2021"
rust-version = "1.95"

[lib]
name = "chip_count"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["launch-agent"]
launch-agent = ["dep:tauri-plugin-autostart"]
custom-protocol = ["tauri/custom-protocol"]
app-store = ["custom-protocol"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
chip-core = { path = "../crates/chip-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "8"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
